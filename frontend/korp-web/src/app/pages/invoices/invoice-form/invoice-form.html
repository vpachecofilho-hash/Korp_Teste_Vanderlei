<h2>Nova nota fiscal</h2>

<div>
  <label>Produto</label>

  <select [(ngModel)]="selectedProductId">
    <option value="">
      Selecione...
    </option>

    <option
      *ngFor="let product of products"
      [value]="product.id">

      {{ product.code }}
      -
      {{ product.description }}
      (Saldo: {{ product.stock }})

    </option>
  </select>
</div>

<div>
  <label>Quantidade</label>

  <input
    type="number"
    min="0.001"
    step="0.001"
    [(ngModel)]="quantity">
</div>

<button
  type="button"
  (click)="addItem()">

  Adicionar produto

</button>

<hr>

<h3>Itens da nota</h3>

<p *ngIf="items.length === 0">
  Nenhum produto adicionado.
</p>

<table *ngIf="items.length > 0">
  <thead>
    <tr>
      <th>Produto</th>
      <th>Quantidade</th>
      <th></th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let item of items">
      <td>
        {{ getProductDescription(item.productId) }}
      </td>

      <td>
        {{ item.quantity }}
      </td>

      <td>
        <button
          type="button"
          (click)="removeItem(item.productId)">
          Remover
        </button>
      </td>
    </tr>
  </tbody>
</table>

<p *ngIf="errorMessage">
  {{ errorMessage }}
</p>

<button
  type="button"
  (click)="save()"
  [disabled]="items.length === 0 || loading">

  {{ loading ? 'Criando...' : 'Criar nota' }}

</button>
