<h2>Nova nota fiscal</h2>

<div class="form-fields">

  <div class="form-row">
    <label for="product">Produto</label>

    <select
      id="product"
      [(ngModel)]="selectedProductId">

      <option value="">
        Selecione...
      </option>

      <option
        *ngFor="let product of products"
        [value]="product.id">

        {{ product.code }}
        -
        {{ product.description }}
        (Saldo: {{ product.stock }})

      </option>
    </select>
  </div>


  <div class="form-row">
    <label for="quantity">Quantidade</label>

    <input
      id="quantity"
      type="number"
      min="0.001"
      step="0.001"
      [(ngModel)]="quantity">
  </div>

</div>


<div class="actions">
  <button
    type="button"
    (click)="addItem()">

    Adicionar produto

  </button>
</div>


<section class="invoice-items">

  <h3>Itens da nota</h3>

  <p *ngIf="items.length === 0">
    Nenhum produto adicionado.
  </p>

  <table *ngIf="items.length > 0">

    <thead>
      <tr>
        <th>Produto</th>
        <th>Quantidade</th>
        <th class="actions-column"></th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let item of items">

        <td>
          {{ getProductDescription(item.productId) }}
        </td>

        <td>
          {{ item.quantity }}
        </td>

        <td class="actions-column">

          <button
            type="button"
            (click)="removeItem(item.productId)">

            Remover

          </button>

        </td>

      </tr>

    </tbody>

  </table>

</section>


<p
  class="error-message"
  *ngIf="errorMessage">

  {{ errorMessage }}

</p>


<div class="actions footer-actions">

  <button
    type="button"
    (click)="save()"
    [disabled]="items.length === 0 || loading">

    {{ loading ? 'Criando...' : 'Criar nota' }}

  </button>

</div>
