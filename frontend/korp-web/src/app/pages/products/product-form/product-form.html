<h2>Novo produto</h2>

<form
  [formGroup]="form"
  (ngSubmit)="save()">

  <div class="form-row">

    <label for="code">
      Código
    </label>

    <input
      id="code"
      formControlName="code">

  </div>


  <div class="form-row">

    <label for="description">
      Descrição
    </label>

    <input
      id="description"
      formControlName="description">

  </div>


  <div class="form-row">

    <label for="stock">
      Saldo
    </label>

    <input
      id="stock"
      type="number"
      formControlName="stock">

  </div>


  <div class="actions">

    <button
      type="submit"
      [disabled]="form.invalid || loading">

      {{ loading ? 'Salvando...' : 'Salvar produto' }}

    </button>

  </div>

</form>


<p
  class="message"
  *ngIf="message">

  {{ message }}

</p>
